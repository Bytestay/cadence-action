name: Demo

# The action on a real pull request: open a PR that changes a schedule under demo/ to see the comment and the
# annotations.
on:
  pull_request:
    paths: ["demo/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        with:
          rapidapi-key: ${{ secrets.RAPIDAPI_KEY }}
          workflow-paths: "demo/*.yml"
          cronjob-paths: "demo/*.yaml"
          timezone: Europe/Lisbon
