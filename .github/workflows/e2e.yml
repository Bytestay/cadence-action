name: E2E

# Runs this action (uses: ./) against the real Cadence API through each marketplace: one valid expression
# (validate, explain, next) and one invalid one (validate only), so 4 requests per marketplace.
# RapidAPI needs the repository secret RAPIDAPI_KEY, API.market needs API_MARKET_KEY; a missing one skips its job.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 1 * *"   # monthly: 4 requests, so it fits the free Basic plan (15 a month)

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.market }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: rapidapi
            secret: RAPIDAPI_KEY
          - market: api.market
            secret: API_MARKET_KEY
    env:
      HAS_KEY: ${{ secrets[matrix.secret] != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::${{ matrix.secret }} is not set; skipping the ${{ matrix.market }} end-to-end test."
      - name: A workflow with two schedules
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p e2e
          printf 'on:\n  schedule:\n    - cron: "30 1 * * 1-5"\n    - cron: "61 * * * *"\njobs: {}\n' > e2e/nightly.yml
          git add e2e
      - name: Check it with the action
        if: env.HAS_KEY == 'true'
        id: check
        continue-on-error: true   # the second schedule is invalid on purpose
        uses: ./
        with:
          rapidapi-key: ${{ matrix.market == 'rapidapi' && secrets.RAPIDAPI_KEY || '' }}
          api-market-key: ${{ matrix.market == 'api.market' && secrets.API_MARKET_KEY || '' }}
          workflow-paths: e2e/*.yml
          cronjob-paths: ""
          check-all: "true"
          timezone: Europe/Lisbon
          comment: "false"
          max-requests: "4"
      - name: Check the outputs
        if: env.HAS_KEY == 'true'
        env:
          PASSED: ${{ steps.check.outputs.passed }}
          CHECKED: ${{ steps.check.outputs.expressions-checked }}
          INVALID: ${{ steps.check.outputs.invalid }}
          WARNINGS: ${{ steps.check.outputs.warnings }}
          REQUESTS: ${{ steps.check.outputs.requests-used }}
          QUOTA: ${{ steps.check.outputs.quota-remaining }}
          OUTCOME: ${{ steps.check.outcome }}
          MARKET: ${{ matrix.market }}
        run: |
          echo "passed=$PASSED checked=$CHECKED invalid=$INVALID warnings=$WARNINGS requests=$REQUESTS quota=$QUOTA outcome=$OUTCOME"
          test "$OUTCOME" = failure    # the invalid expression must fail the step
          test "$PASSED" = false
          test "$CHECKED" = 2
          test "$INVALID" = 1
          test "$WARNINGS" = 0
          test "$REQUESTS" = 4
          if [ "$MARKET" = rapidapi ]; then test -n "$QUOTA"; fi   # RapidAPI's quota header came through
